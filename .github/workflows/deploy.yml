
name: Build HTML with Secret

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create config.js with secret
        run: |
          printf 'const MY_SECRET = "%s";\n' "${{ secrets.SUPABASE_ANON_KEY }}" > config.js

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: |
            index.html
            config.js
